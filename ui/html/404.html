{{template "base" .}}

{{define "title"}}404 - Page Not Found{{end}}

{{define "content"}}
<div class="container-fluid py-5">
    <div class="container py-5 text-center">
        <ol class="breadcrumb justify-content-center mb-5">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item active text-dark">404</li>
        </ol>
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <i class="bi bi-exclamation-triangle display-1 text-secondary"></i>
                <h1 class="display-1">404</h1>
                <h1 class="mb-4">Page Not Found</h1>
                <p class="mb-4">Sorry, the page you were looking for is not available on our site! You might want to go to our homepage or use the search?</p>
                <a class="btn link-hover border border-primary rounded-pill py-3 px-5" href="/">Return to Homepage</a>
            </div>
        </div>
    </div>
</div>
{{end}}
