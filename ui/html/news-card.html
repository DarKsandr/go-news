{{ define "news-card" }}
<div class="bg-light rounded">
        <div class="rounded-top overflow-hidden">
            <img src="{{.ImageUrl}}" class="img-zoomin img-fluid rounded-top w-100" alt="{{.Title}}">
        </div>
        <div class="d-flex flex-column p-4">
            <a href="/news/{{.ID}}" class="h4">{{.Title}}</a>
            <div class="d-flex justify-content-between">
                <a href="#" class="small text-body link-hover">by {{.User.Name}}</a>
                <small class="text-body d-block"><i class="fas fa-calendar-alt me-1"></i>{{.CreatedAt.Format "Jan 2, 2006"}}</small>
            </div>
        </div>
    </div>
{{ end }}
